name: Publish to Hex

# Tag push only (e.g. `git tag v0.1.0 && git push origin v0.1.0`) --
# never automatic on an ordinary push to main, so cutting a release is
# a deliberate, separate step from merging.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  # Reuses this repo's own CI workflow (format/compile/credo/sobelow/
  # test/dialyzer) as a gate -- a tag pointing at code that doesn't pass
  # is refused a publish, not just a merge.
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Restore deps/_build cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - run: mix deps.get

      # Publishes both the package and its docs (to hexdocs.pm) in one
      # call -- `mix hex.publish` bundles the docs step automatically
      # whenever `ex_doc` is a dependency, which it is here (dev-only).
      # `--yes` skips the interactive confirmation prompt; `HEX_API_KEY`
      # is `mix hex.publish`'s own documented non-interactive auth path
      # for CI, no local `mix hex.user` login needed.
      - run: mix hex.publish --yes
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
